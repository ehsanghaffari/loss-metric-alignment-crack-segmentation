name: Assemble final source files
on:
  push:
    branches: [final-72-run-repository-update]
    paths:
      - 'staging/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-72-run-repository-update
      - name: Assemble when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          assemble_one() {
            prefix="$1"
            expected="$2"
            output="$3"
            count=$(find "staging/$prefix" -maxdepth 1 -type f -name 'part_*' 2>/dev/null | wc -l)
            if [ "$count" -ne "$expected" ]; then
              echo "$prefix: $count/$expected chunks present; waiting."
              return 0
            fi
            cat "staging/$prefix"/part_* | base64 -d > "$output"
            echo "assembled $output"
          }
          assemble_one scorer 13 code/score_paper_probmaps_v2_preflight.py
          assemble_one trainer 7 code/train_all_four_datasets_72runs_full100_no_early_stopping_v2.py
          if git diff --quiet; then
            echo 'No assembled-source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/score_paper_probmaps_v2_preflight.py code/train_all_four_datasets_72runs_full100_no_early_stopping_v2.py
          git commit -m 'Assemble exact final source files from uploaded chunks'
          git push origin HEAD:final-72-run-repository-update
